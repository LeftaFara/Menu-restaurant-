<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notre carte</title>
<!--
SQL à exécuter une fois dans Supabase (SQL Editor) :

create table plats (
  id bigint generated always as identity primary key,
  categorie text not null default 'Plats',
  nom text not null,
  description text default '',
  prix integer not null default 0,
  created_at timestamptz default now()
);
alter table plats enable row level security;
create policy "lecture publique" on plats for select using (true);
create policy "ecriture admin" on plats for all using (true) with check (true);
alter publication supabase_realtime add table plats;

SQL pour les photos (à exécuter une fois, après le premier SQL) :

alter table plats add column image_url text;
insert into storage.buckets (id, name, public) values ('plats', 'plats', true) on conflict (id) do nothing;
create policy "photos lecture" on storage.objects for select using (bucket_id = 'plats');
create policy "photos ajout" on storage.objects for insert with check (bucket_id = 'plats');
create policy "photos modif" on storage.objects for update using (bucket_id = 'plats');
create policy "photos suppression" on storage.objects for delete using (bucket_id = 'plats');
-->

<style>
:root{--bg:#f6f0e4;--card:#fffdf7;--fg:#2b1d14;--mut:#7a6755;--acc:#9c3d1f;--line:#e4d8c3;--hd:#f1e8d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171310;--card:#221c17;--fg:#f1e7d8;--mut:#b4a490;--acc:#ec8f5e;--line:#38302a;--hd:#221c17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171310;--card:#221c17;--fg:#f1e7d8;--mut:#b4a490;--acc:#ec8f5e;--line:#38302a;--hd:#221c17;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hd);padding:12px 16px 6px;text-align:center;box-shadow:0 1px 0 var(--line)}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:28px;color:var(--acc)}
header p{margin:2px 0 0;font-size:13px;font-style:italic;color:var(--mut)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;max-width:760px;margin:0 auto;justify-content:center}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:18px;padding:7px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main,#adm{max-width:760px;margin:0 auto;padding:8px 16px 32px}
h2{font-family:Georgia,"Times New Roman",serif;color:var(--acc);font-size:24px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:16px}
.pr{color:var(--acc);white-space:nowrap}
.card p{margin:4px 0 0;font-size:14px;color:var(--mut);line-height:1.45}
.msg{text-align:center;color:var(--mut);margin:32px 0}
footer{text-align:center;padding:0 16px 32px}
footer button{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;font-size:13px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:#fff;cursor:pointer}
.btn.sec{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.del{background:#b3261e}
.g2{display:grid;grid-template-columns:1fr 120px;gap:8px}
.fld{display:grid;gap:8px;margin:8px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
label{font-size:13px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dish{display:flex;gap:12px;align-items:flex-start}.dish .in{flex:1;min-width:0}
.th{flex:none;width:88px;height:88px;border-radius:10px;object-fit:cover;background:var(--line)}
.ph0{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);text-align:center}
.pbox{display:flex;gap:12px;align-items:center;margin-bottom:8px}
label.btn{display:inline-block;font-size:15px;color:var(--fg)}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0;pointer-events:none}
</style></head><body>

<div id="client">
  <header>
    <h1 id="logo">Notre carte</h1><p>Cuisine maison, préparée à la commande</p>
    <nav id="nav"></nav>
  </header>
  <main id="m"></main>
  <footer><button id="go-admin">Espace admin</button></footer>
</div>

<div id="adm" hidden>
  <h2>Espace administrateur</h2>
  <div id="login" class="card">
    <label for="pw">Mot de passe</label>
    <div class="fld"><input id="pw" type="password" autocomplete="off"></div>
    <div class="acts"><button class="btn" id="do-login">Se connecter</button><button class="btn sec" data-back>Retour au menu</button></div>
  </div>
  <div id="panel" hidden>
    <div class="acts"><button class="btn sec" data-back>Voir le menu</button><button class="btn sec" id="logout">Se déconnecter</button></div>
    <div class="card" style="margin-top:12px">
      <b>Connexion Supabase</b>
      <div class="fld">
        <label for="sburl">URL du projet</label><input id="sburl" placeholder="https://xxxx.supabase.co" autocomplete="off">
        <label for="sbkey">Clé API anonyme (anon public)</label><input id="sbkey" type="password" autocomplete="off">
      </div>
      <button class="btn" id="save-conf">Enregistrer et connecter</button>
    </div>
    <div class="card" style="margin-top:12px">
      <b>Ajouter un plat</b>
      <div class="fld">
        <select id="n-cat" aria-label="Catégorie"></select>
        <div class="g2"><input id="n-nom" placeholder="Nom du plat"><input id="n-prix" type="number" min="0" step="100" placeholder="Prix"></div>
        <textarea id="n-desc" rows="2" placeholder="Description"></textarea>
        <div><label class="btn sec" for="n-photo" id="n-photo-l">Ajouter une photo</label><input id="n-photo" type="file" accept="image/*"></div>
      </div>
      <button class="btn" id="add">Ajouter</button>
    </div>
    <p class="msg" style="margin:12px 0 0">Chaque modification est envoyée à Supabase dès que vous quittez un champ.</p>
    <div id="list"></div>
    <div class="acts" style="margin-top:16px"><button class="btn sec" id="seed">Importer les plats d’exemple</button></div>
  </div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// Mot de passe de l’espace admin (à changer). Il protège l’interface, pas les données.
const CFG = window.MENU_CONFIG || {};
const ADMIN_PASSWORD = CFG.password || "admin123";
// Pour que le menu s’affiche chez vos clients, collez ici l’URL et la clé anonyme.
const DEFAULT_URL = CFG.url || "", DEFAULT_KEY = CFG.key || "";
const CATS = ["Entrées", "Plats", "Desserts", "Boissons"];
const SAMPLE = [
  ["Entrées","Salade avocat-crevettes","Avocat, crevettes sautées, citron vert et huile d’olive.",3500],
  ["Entrées","Accras de poisson","Beignets croustillants servis avec une sauce pimentée.",3000],
  ["Entrées","Soupe de poisson","Soupe épicée aux légumes et au poisson frais.",2500],
  ["Plats","Thiéboudienne","Riz au poisson, légumes et sauce tomate, le plat national.",5500],
  ["Plats","Yassa poulet","Poulet mariné aux oignons et au citron, servi avec du riz.",5000],
  ["Plats","Poulet braisé et alloco","Poulet grillé au charbon, bananes plantain frites.",6000],
  ["Desserts","Thiakry","Couscous de mil, lait caillé sucré et vanille.",1500],
  ["Desserts","Fondant au chocolat","Cœur coulant, servi tiède.",2500],
  ["Desserts","Salade de fruits frais","Fruits de saison coupés à la minute.",2000],
  ["Boissons","Bissap","Infusion glacée de fleurs d’hibiscus.",1000],
  ["Boissons","Jus de gingembre","Frais, piquant et peu sucré.",1000],
  ["Boissons","Jus de bouye","Jus de fruit du baobab, onctueux.",1000],
  ["Boissons","Eau minérale","Bouteille de 50 cl.",500]
].map(s => ({ categorie: s[0], nom: s[1], description: s[2], prix: s[3] }));

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const P = n => Number(n || 0).toLocaleString("fr-FR") + " FCFA";
const store = {
  get(k){ try { return localStorage.getItem(k) || "" } catch(e){ return "" } },
  set(k, v){ try { localStorage.setItem(k, v) } catch(e){} }
};
let sb = null, dishes = [], cat = "Tous", authed = false, channel = null;
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 2400) }
const conf = () => ({ url: store.get("sb_url") || DEFAULT_URL, key: store.get("sb_key") || DEFAULT_KEY });

function connect(){
  const { url, key } = conf();
  sb = null;
  if (channel) { try { channel.unsubscribe() } catch(e){} channel = null }
  if (!url || !key || !window.supabase) return false;
  try { sb = supabase.createClient(url, key) } catch(e){ return false }
  try { channel = sb.channel("plats-live").on("postgres_changes", { event: "*", schema: "public", table: "plats" }, () => load()).subscribe() } catch(e){}
  return true;
}
async function load(){
  if (!sb) { $("#m").innerHTML = '<p class="msg">Menu non connecté. L’administrateur doit renseigner l’URL et la clé Supabase.</p>'; return }
  const { data, error } = await sb.from("plats").select("*").order("id");
  if (error) { $("#m").innerHTML = '<p class="msg">Erreur : ' + esc(error.message) + '</p>'; return }
  dishes = data || [];
  draw(); if (authed) renderAdmin();
}

function draw(){
  $("#nav").innerHTML = ["Tous", ...CATS].map(n => `<button class="chip${n === cat ? " on" : ""}" data-c="${n}">${n}</button>`).join("");
  let h = "";
  CATS.forEach(c => {
    if (cat !== "Tous" && cat !== c) return;
    const it = dishes.filter(d => d.categorie === c);
    if (!it.length) return;
    h += `<h2>${c}</h2>` + it.map(d => `<article class="card dish">${d.image_url ? `<img class="th" src="${esc(d.image_url)}" alt="${esc(d.nom)}" loading="lazy">` : ""}<div class="in"><div class="row"><span>${esc(d.nom)}</span><span class="pr">${P(d.prix)}</span></div><p>${esc(d.description)}</p></div></article>`).join("");
  });
  if (sb) $("#m").innerHTML = h || '<p class="msg">Aucun plat dans cette catégorie pour le moment.</p>';
}
$("#nav").onclick = e => { const b = e.target.closest(".chip"); if (b) { cat = b.dataset.c; draw() } };

function show(admin){ $("#client").hidden = admin; $("#adm").hidden = !admin; window.scrollTo(0, 0) }
function gate(){
  $("#login").hidden = authed; $("#panel").hidden = !authed;
  if (authed) { const c = conf(); $("#sburl").value = c.url; $("#sbkey").value = c.key; renderAdmin() }
}
$("#go-admin").onclick = () => { show(true); gate() };
let taps = 0, tt;
$("#logo").onclick = () => { taps++; clearTimeout(tt); tt = setTimeout(() => taps = 0, 1500); if (taps >= 5) { taps = 0; $("#go-admin").click() } };
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => { show(false); draw() });
$("#do-login").onclick = () => {
  if ($("#pw").value === ADMIN_PASSWORD) { authed = true; $("#pw").value = ""; gate() } else toast("Mot de passe incorrect");
};
$("#pw").onkeydown = e => { if (e.key === "Enter") $("#do-login").click() };
$("#logout").onclick = () => { authed = false; gate() };
$("#save-conf").onclick = async () => {
  store.set("sb_url", $("#sburl").value.trim()); store.set("sb_key", $("#sbkey").value.trim());
  if (!connect()) return toast("URL ou clé invalide");
  await load(); toast("Connexion enregistrée");
};

function renderAdmin(){
  $("#n-cat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");
  $("#list").innerHTML = CATS.map(c => {
    const it = dishes.filter(d => d.categorie === c);
    return `<h2>${c}</h2>` + (it.map(d => `<div class="card" data-id="${d.id}">
      <div class="pbox">${d.image_url ? `<img class="th" src="${esc(d.image_url)}" alt="">` : '<div class="th ph0">Pas de photo</div>'}
        <div class="acts"><label class="btn sec">${d.image_url ? "Changer" : "Ajouter"} la photo<input type="file" accept="image/*" data-photo></label>${d.image_url ? '<button class="btn sec" data-nophoto>Retirer</button>' : ""}</div></div>
      <div class="g2"><input data-f="nom" value="${esc(d.nom)}" aria-label="Nom"><input data-f="prix" type="number" min="0" step="100" value="${esc(d.prix)}" aria-label="Prix"></div>
      <div class="fld"><textarea data-f="description" rows="2" aria-label="Description">${esc(d.description)}</textarea></div>
      <button class="btn del" data-del>Supprimer</button></div>`).join("") || '<p class="msg" style="margin:8px 0">Aucun plat.</p>');
  }).join("");
}

async function toBlob(file){
  const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = URL.createObjectURL(file) });
  const r = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.8));
}
async function uploadPhoto(file){
  const blob = await toBlob(file);
  if (!blob) throw new Error("Photo illisible");
  const path = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
  const { error } = await sb.storage.from("plats").upload(path, blob, { contentType: "image/jpeg" });
  if (error) throw error;
  return sb.storage.from("plats").getPublicUrl(path).data.publicUrl;
}
$("#n-photo").onchange = e => { $("#n-photo-l").textContent = e.target.files[0] ? "Photo choisie ✓" : "Ajouter une photo" };
$("#list").onchange = async e => {
  if (e.target.matches("[data-photo]")) {
    const file = e.target.files[0], card = e.target.closest(".card"); if (!file || !card) return;
    if (!sb) return toast("Connectez d’abord Supabase");
    toast("Envoi de la photo…");
    try {
      const url = await uploadPhoto(file);
      const { error } = await sb.from("plats").update({ image_url: url }).eq("id", card.dataset.id);
      if (error) throw error;
      toast("Photo enregistrée"); load();
    } catch(err){ toast("Erreur : " + (err.message || err)) }
    return;
  }
  const f = e.target.dataset.f, card = e.target.closest(".card"); if (!f || !card) return;
  if (!sb) return toast("Connectez d’abord Supabase");
  const d = dishes.find(x => x.id == card.dataset.id); if (!d) return;
  let v = e.target.value.trim();
  if (f === "prix") v = Math.max(0, parseInt(v, 10) || 0);
  if (f === "nom" && !v) { e.target.value = d.nom; return toast("Le nom est obligatoire") }
  const { error } = await sb.from("plats").update({ [f]: v }).eq("id", d.id);
  if (error) return toast("Erreur : " + error.message);
  d[f] = v; draw(); toast("Modifié");
};
$("#list").onclick = async e => {
  const np = e.target.closest("[data-nophoto]");
  if (np && sb) {
    const { error } = await sb.from("plats").update({ image_url: null }).eq("id", np.closest(".card").dataset.id);
    if (error) return toast("Erreur : " + error.message);
    toast("Photo retirée"); load(); return;
  }
  const b = e.target.closest("[data-del]"); if (!b || !sb) return;
  if (!confirm("Supprimer ce plat ?")) return;
  const { error } = await sb.from("plats").delete().eq("id", b.closest(".card").dataset.id);
  if (error) return toast("Erreur : " + error.message);
  toast("Plat supprimé"); load();
};
$("#add").onclick = async () => {
  if (!sb) return toast("Connectez d’abord Supabase");
  const nom = $("#n-nom").value.trim();
  if (!nom) return toast("Le nom est obligatoire");
  let image_url = null;
  const file = $("#n-photo").files[0];
  if (file) { try { toast("Envoi de la photo…"); image_url = await uploadPhoto(file) } catch(err){ return toast("Erreur photo : " + (err.message || err)) } }
  const { error } = await sb.from("plats").insert({ categorie: $("#n-cat").value, nom, description: $("#n-desc").value.trim(), prix: Math.max(0, parseInt($("#n-prix").value, 10) || 0), image_url });
  if (error) return toast("Erreur : " + error.message);
  ["#n-nom", "#n-prix", "#n-desc", "#n-photo"].forEach(s => $(s).value = ""); $("#n-photo-l").textContent = "Ajouter une photo";
  toast("Plat ajouté"); load();
};
$("#seed").onclick = async () => {
  if (!sb) return toast("Connectez d’abord Supabase");
  if (!confirm("Ajouter les 13 plats d’exemple au menu ?")) return;
  const { error } = await sb.from("plats").insert(SAMPLE);
  if (error) return toast("Erreur : " + error.message);
  toast("Exemples importés"); load();
};
connect(); load();
</script>
</body></html>
